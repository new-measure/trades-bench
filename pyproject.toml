[project]
name = "trades-bench"
version = "0.1.0"
description = "Trades Bench - home services business simulation engine"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [{ name = "Trades Bench" }]
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8",
    "hypothesis>=6",
    "ruff>=0.8",
]
geo = [
    "osmium>=4.3.1",
    "shapely>=2.1.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trades_bench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -m 'not docker and not nightly'"
markers = [
    "docker: needs a running Docker daemon and pulls the digest-pinned OSRM image; opt in with `uv run --group geo pytest -m docker`",
    "nightly: slow exhaustive sweeps (every resume boundary of the full window); run on the nightly schedule with `uv run pytest -m nightly`",
]
pythonpath = ["tools"]
filterwarnings = [
    "error",
]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests", "tools"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "C4"]
ignore = [
    "E501",
    "B008",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
"tests/test_geo_*.py" = ["E402"]
